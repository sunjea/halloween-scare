<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Halloween">
<title>Halloween Motion Scare</title>
<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background-color: #05020a; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    perspective: 800px;
  }
  button { font: inherit; }
  :focus-visible { outline: 2px solid #ffaa66; outline-offset: 3px; }

  /* 초기 설정 오버레이 */
  #setup-overlay {
    position: fixed; inset: 0;
    background: radial-gradient(circle, #1a0933 0%, #05020a 100%);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 100; color: #ff6600; text-align: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
    overflow-y: auto;
  }
  #setup-overlay h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    margin-bottom: 12px;
    text-shadow: 0 0 20px #ff3300;
    letter-spacing: .04em;
  }
  #setup-overlay p {
    color: #ccc; font-size: 0.95rem;
    margin-bottom: 20px; line-height: 1.5; max-width: 460px;
  }
  .ios-tip {
    background: rgba(255, 102, 0, 0.12);
    border: 1px solid rgba(255, 102, 0, 0.4);
    color: #ffaa66; padding: 10px 16px; border-radius: 10px;
    font-size: 0.85rem; line-height: 1.55; margin-bottom: 20px; max-width: 440px;
  }
  .controls {
    background: rgba(255, 255, 255, 0.05);
    padding: 16px 22px; border-radius: 14px;
    border: 1px solid rgba(255, 102, 0, 0.3);
    margin-bottom: 22px; color: #eee; width: 100%; max-width: 340px; text-align: left;
  }
  .control-row { margin-bottom: 14px; }
  .control-row:last-child { margin-bottom: 0; }
  .controls label { display: block; margin-bottom: 6px; font-size: 0.9rem; }
  .controls input[type="range"] { width: 100%; accent-color: #ff6600; }
  .controls select {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    background: #1a0933; color: #fff; border: 1px solid #ff6600;
    font-size: 0.95rem;
  }
  .scale { display: flex; justify-content: space-between; font-size: .75rem; color: #998; margin-top: 4px; }

  #start-btn {
    padding: 16px 38px; font-size: 1.2rem; font-weight: bold;
    color: #fff; background: linear-gradient(135deg, #ff5500, #aa0000);
    border: none; border-radius: 50px; cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 60, 0, 0.7);
    -webkit-tap-highlight-color: transparent;
  }
  #start-btn:active { transform: scale(0.96); }
  #start-btn:disabled { opacity: .7; cursor: wait; }

  /* 우측 하단 HUD 및 미니 카메라 프리뷰 */
  #hud {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 15px);
    right: calc(env(safe-area-inset-right, 0px) + 15px);
    z-index: 50;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    opacity: 0.5; transition: opacity 0.3s;
  }
  #hud:active, #hud:hover, #hud:focus-within { opacity: 1; }
  #preview-box {
    width: 96px; height: 72px; border-radius: 8px;
    overflow: hidden; border: 1px solid rgba(255, 102, 0, 0.5);
    background: #000; position: relative;
  }
  #webcam {
    width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1); /* 거울 모드 */
  }
  #preview-box.nocam #webcam { display: none; }
  #preview-box.nocam::after {
    content: "카메라 꺼짐"; position: absolute; inset: 0;
    display: grid; place-items: center; font-size: .7rem; color: #886;
  }
  .hud-bar {
    display: flex; align-items: center; gap: 8px;
    background: rgba(0, 0, 0, 0.7); padding: 6px 12px;
    border-radius: 16px; color: #aaa; font-size: 0.75rem;
  }
  .hud-bar button {
    background: none; border: 0; color: #ffaa66; cursor: pointer;
    font-size: .75rem; padding: 2px 4px;
  }
  .hud-bar button:hover { color: #fff; }
  .hud-bar .sep { width: 1px; height: 12px; background: #444; }
  #motion-meter {
    width: 50px; height: 6px; background: #222;
    border-radius: 3px; overflow: hidden;
  }
  #motion-bar {
    width: 0%; height: 100%; background: #ff4500;
    transition: width 0.08s;
  }

  /* 평상시 대기 화면 */
  #ambient-scene {
    position: absolute; inset: 0;
    display: flex; justify-content: center; align-items: center;
    background: radial-gradient(circle at 50% 65%, #1f0c2e 0%, #040108 80%);
    overflow: hidden;
  }
  .fog {
    position: absolute; left: 0; top: 0; width: 200%; height: 100%;
    background: repeating-linear-gradient(
      90deg, transparent 0%, rgba(120, 80, 160, 0.06) 25%, transparent 50%
    );
    animation: drift 18s linear infinite;
  }
  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .idle-pumpkin {
    width: min(45vmin, 220px); height: min(45vmin, 220px);
    filter: drop-shadow(0 0 25px #ff5500);
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 0 20px #ff4400); }
    50% { transform: translateY(-15px) scale(1.04); filter: drop-shadow(0 0 40px #ff8800); }
  }

  /* 앞으로 튀어나오는 3D 점프스케어 스테이지 */
  #scare-stage {
    position: absolute; inset: 0;
    display: flex; justify-content: center; align-items: center;
    pointer-events: none; z-index: 30;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
  }
  #monster-wrapper {
    width: 80vmin; height: 80vmin;
    position: relative; opacity: 0;
    transform: translate3d(0, 0, -700px) scale(0.05) rotateZ(-8deg);
    -webkit-transform: translate3d(0, 0, -700px) scale(0.05) rotateZ(-8deg);
    will-change: transform, opacity, filter;
  }
  #scare-stage.active #monster-wrapper {
    animation: popOut3D 2.4s cubic-bezier(0.12, 0.95, 0.25, 1) forwards;
  }
  @keyframes popOut3D {
    0%   { opacity: 0; transform: translate3d(0, 0, -700px) scale(0.05) rotateZ(-10deg); filter: brightness(0.2); }
    14%  { opacity: 1; transform: translate3d(0, 0, 320px) scale(1.8) rotateZ(4deg);
           filter: brightness(1.5) contrast(1.7) drop-shadow(0 25px 50px rgba(255, 0, 0, 0.95)); }
    22%  { transform: translate3d(-12px, 10px, 290px) scale(1.65) rotateZ(-5deg); }
    30%  { transform: translate3d(12px, -10px, 350px) scale(1.9) rotateZ(3deg); }
    40%  { transform: translate3d(-6px, 6px, 310px) scale(1.75) rotateZ(-2deg); }
    82%  { opacity: 1; transform: translate3d(0, 0, 370px) scale(2.0) rotateZ(0deg);
           filter: brightness(1.3) contrast(1.5) drop-shadow(0 0 70px rgba(255, 0, 0, 1)); }
    100% { opacity: 0; transform: translate3d(0, 0, 550px) scale(2.6); filter: brightness(0) blur(10px); }
  }
  #scare-stage.active ~ #ambient-scene .idle-pumpkin { opacity: 0; transition: opacity .1s; }

  #flash-overlay {
    position: fixed; inset: 0;
    background: radial-gradient(circle, transparent 20%, rgba(200, 0, 0, 0.75) 100%);
    opacity: 0; pointer-events: none; z-index: 40;
  }
  #scare-stage.active ~ #flash-overlay {
    animation: strobeFlash 0.6s ease-out;
  }
  @keyframes strobeFlash {
    0%, 40%, 80% { opacity: 1; background-color: rgba(255, 30, 0, 0.35); }
    20%, 60%, 100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fog, .idle-pumpkin { animation: none; }
    #scare-stage.active ~ #flash-overlay { animation: none; }
  }

  #motion-canvas { display: none; }
  #notice {
    position: fixed; z-index: 60;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 50%; transform: translateX(-50%);
    width: min(440px, calc(100vw - 32px));
    background: rgba(26, 9, 51, .95); border: 1px solid rgba(255, 102, 0, .6);
    color: #ffd2b0; font-size: .9rem; line-height: 1.55;
    padding: 12px 16px; border-radius: 12px; cursor: pointer;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .5);
  }
</style>

</head>
<body>

<!-- 1. 시작 및 설정 오버레이 -->
<div id="setup-overlay">
  <h1>HALLOWEEN SCREEN</h1>
  <p>카메라가 움직임을 감지하면 괴물이 화면 밖으로 돌진합니다.</p>
  <div class="ios-tip">
    <b>아이폰/아이패드 팁:</b> 벨소리/무음 스위치를 해제(소리 켜짐)해야 비명 효과음이 들립니다.<br>
    사파리 <b>[공유] → [홈 화면에 추가]</b>로 열면 주소창 없는 전체화면이 됩니다.
  </div>

  <div class="controls">
    <div class="control-row">
      <label for="camera-select">사용할 카메라</label>
      <select id="camera-select">
        <option value="user">전면 카메라 (화면을 보는 사람 감지)</option>
        <option value="environment">후면 카메라</option>
      </select>
    </div>
    <div class="control-row">
      <label for="sensitivity">모션 감지 민감도: <span id="sens-val">25</span></label>
      <input type="range" id="sensitivity" min="5" max="55" value="25">
      <div class="scale"><span>둔감</span><span>예민</span></div>
    </div>
  </div>

  <button id="start-btn" type="button">카메라 켜고 감시 시작</button>
</div>

<!-- 2. 3D 점프스케어 스테이지 -->
<div id="scare-stage" aria-hidden="true">
  <div id="monster-wrapper">
    <svg viewBox="0 0 500 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bloodGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ff0000" stop-opacity="0.9"/>
          <stop offset="70%" stop-color="#440000" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="skin" cx="50%" cy="38%" r="65%">
          <stop offset="0%" stop-color="#6e2a1b"/>
          <stop offset="55%" stop-color="#2c0d09"/>
          <stop offset="100%" stop-color="#080202"/>
        </radialGradient>
        <radialGradient id="maw" cx="50%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#6a0000"/>
          <stop offset="100%" stop-color="#050000"/>
        </radialGradient>
        <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff4a8"/>
          <stop offset="35%" stop-color="#ff3a00"/>
          <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <circle cx="250" cy="250" r="245" fill="url(#bloodGlow)"/>
      <!-- 뿔 -->
      <path d="M150 150 C 108 112, 86 62, 118 18 C 124 72, 160 102, 196 120 Z" fill="#160606"/>
      <path d="M350 150 C 392 112, 414 62, 382 18 C 376 72, 340 102, 304 120 Z" fill="#160606"/>
      <!-- 머리 -->
      <path d="M250 70 C 362 70, 412 162, 400 262 C 392 342, 350 420, 250 462 C 150 420, 108 342, 100 262 C 88 162, 138 70, 250 70 Z" fill="url(#skin)"/>
      <!-- 금 간 자국 -->
      <path d="M250 78 L238 118 L256 150 L244 182" stroke="#0a0000" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M118 250 L142 272 L130 306 L146 330" stroke="#0a0000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M384 238 L362 262 L374 292" stroke="#0a0000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- 눈썹 뼈 그림자 -->
      <path d="M138 192 Q 200 148 246 200 Q 250 208 254 200 Q 300 148 362 192 L 362 216 Q 300 184 255 226 L 245 226 Q 200 184 138 216 Z" fill="#0a0202"/>
      <!-- 눈구멍 -->
      <ellipse cx="192" cy="228" rx="44" ry="31" transform="rotate(14 192 228)" fill="#000"/>
      <ellipse cx="308" cy="228" rx="44" ry="31" transform="rotate(-14 308 228)" fill="#000"/>
      <circle cx="195" cy="231" r="24" fill="url(#eyeGlow)" filter="url(#glow)"/>
      <circle cx="305" cy="231" r="24" fill="url(#eyeGlow)" filter="url(#glow)"/>
      <ellipse cx="195" cy="231" rx="3.5" ry="13" fill="#1a0000"/>
      <ellipse cx="305" cy="231" rx="3.5" ry="13" fill="#1a0000"/>
      <!-- 코 -->
      <path d="M240 272 L231 302 L245 296 Z M260 272 L269 302 L255 296 Z" fill="#000"/>
      <!-- 입 -->
      <path d="M162 320 Q 250 298 338 320 Q 332 424 250 444 Q 168 424 162 320 Z" fill="url(#maw)"/>
      <path d="M168 322 L181 364 L195 317 L208 374 L222 314 L236 382 L250 313 L264 382 L278 314 L292 374 L305 317 L319 364 L332 322 Z" fill="#eadcbc"/>
      <path d="M188 420 L200 384 L212 428 L226 378 L240 434 L250 382 L260 434 L274 378 L288 428 L300 384 L312 420 Q 250 448 188 420 Z" fill="#d6c6a2"/>
      <!-- 핏방울 -->
      <path d="M206 428 q5 26 1 52 q-7 -24 -1 -52 Z" fill="#8a0000"/>
      <path d="M286 430 q5 18 1 36 q-6 -16 -1 -36 Z" fill="#8a0000"/>
      <path d="M248 444 q4 16 0 30 q-5 -14 0 -30 Z" fill="#6a0000"/>
    </svg>
  </div>
</div>

<!-- 3. 대기 화면 -->
<div id="ambient-scene">
  <div class="fog"></div>
  <svg class="idle-pumpkin" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="떠 있는 호박등">
    <path d="M92 35 Q100 15 112 25 L105 45 Z" fill="#2d4c1e"/>
    <ellipse cx="100" cy="110" rx="75" ry="60" fill="#d94e0f"/>
    <ellipse cx="100" cy="110" rx="50" ry="62" fill="#ea5b12"/>
    <ellipse cx="100" cy="110" rx="25" ry="64" fill="#ff6a1a"/>
    <polygon points="65,85 85,100 55,105" fill="#1a0500"/>
    <polygon points="135,85 115,100 145,105" fill="#1a0500"/>
    <polygon points="100,105 92,120 108,120" fill="#1a0500"/>
    <path d="M60 130 L75 142 L90 132 L100 144 L110 132 L125 142 L140 130 L128 152 L110 142 L100 154 L90 142 L72 152 Z" fill="#ffcc00"/>
  </svg>
</div>

<div id="flash-overlay"></div>

<!-- 4. HUD -->
<div id="hud" hidden>
  <div id="preview-box"><video id="webcam" playsinline muted autoplay></video></div>
  <div class="hud-bar"><span id="status">감시 중</span><div id="motion-meter"><div id="motion-bar"></div></div></div>
  <div class="hud-bar"><button id="test-btn" type="button">테스트</button><span class="sep"></span><button id="settings-btn" type="button">설정</button></div>
</div>

<div id="notice" role="status" hidden></div>

<canvas id="motion-canvas"></canvas>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const overlay = $('setup-overlay'), startBtn = $('start-btn'), sens = $('sensitivity'), sensVal = $('sens-val');
  const camSel = $('camera-select'), hud = $('hud'), video = $('webcam'), statusEl = $('status');
  const meter = $('motion-bar'), stage = $('scare-stage'), previewBox = $('preview-box');
  const mc = $('motion-canvas'), mctx = mc.getContext('2d', { willReadFrequently: true });

  const MW = 64, MH = 48; mc.width = MW; mc.height = MH;
  const SCARE_MS = 2500, COOLDOWN_MS = 3500;
  let stream = null, audio = null, prev = null, timer = null;
  let armedAt = 0, busyUntil = 0, fallback = false, moveDist = 0, lastPt = null, wakeLock = null;

  sens.addEventListener('input', () => { sensVal.textContent = sens.value; });
  // 민감도 5~55 → 화면 픽셀 중 몇 %가 바뀌면 작동할지 (높을수록 예민)
  const threshold = () => (60 - Number(sens.value)) / 4;

  /* ---------- 시작 ---------- */
  startBtn.addEventListener('click', start);
  async function start() {
    startBtn.disabled = true; startBtn.textContent = '카메라 준비 중…';
    // 사용자 터치 안에서 오디오 잠금 해제 (iOS 필수)
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      await audio.resume();
      const b = audio.createBuffer(1, 1, 22050), s = audio.createBufferSource();
      s.buffer = b; s.connect(audio.destination); s.start(0);
    } catch (e) { audio = null; }

    fallback = false; previewBox.classList.remove('nocam');
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera api');
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: camSel.value, width: { ideal: 320 }, height: { ideal: 240 } }, audio: false
      });
      video.srcObject = stream;
      await video.play().catch(() => {});
      video.style.transform = camSel.value === 'user' ? 'scaleX(-1)' : 'none';
      statusEl.textContent = '감시 중';
    } catch (e) {
      // 카메라를 못 쓰면 마우스/터치 움직임으로 대신 감지
      fallback = true;
      previewBox.classList.add('nocam');
      const why = camReason(e);
      statusEl.textContent = why.short + ' · 터치로 감지';
      showNotice(why.long);
    }

    overlay.hidden = true; hud.hidden = false;
    prev = null; moveDist = 0; lastPt = null;
    armedAt = performance.now() + 1500;  // 카메라 노출이 안정될 때까지 대기
    busyUntil = 0;
    clearInterval(timer); timer = setInterval(sample, 100);

    try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (e) {}
    keepAwake();
    startBtn.disabled = false; startBtn.textContent = '카메라 켜고 감시 시작';
  }

  function camReason(e) {
    const n = e && e.name;
    if (!window.isSecureContext)
      return { short: 'https 아님', long: '카메라는 https 주소에서만 켜집니다. 파일을 그냥 열면 작동하지 않아요. 웹에 올린 https 주소로 열어 주세요.' };
    if (n === 'NotAllowedError' || n === 'SecurityError')
      return { short: '권한 거부', long: '카메라 권한이 막혀 있어요. 아이폰은 설정 → Safari → 카메라를 "허용"으로, 안드로이드는 크롬 주소창 왼쪽 자물쇠 → 권한에서 카메라를 허용해 주세요. 카카오톡 등 앱 안 브라우저라면 Safari/크롬으로 다시 열어 주세요.' };
    if (n === 'NotFoundError' || n === 'OverconstrainedError')
      return { short: '카메라 없음', long: '선택한 카메라를 찾지 못했어요. 설정에서 전면/후면을 바꿔 보세요.' };
    if (n === 'NotReadableError' || n === 'AbortError')
      return { short: '카메라 사용 중', long: '다른 앱이 카메라를 쓰고 있어요. 카메라 앱이나 영상통화를 닫고 다시 시작해 주세요.' };
    return { short: '카메라 차단', long: '이 화면에서는 카메라를 쓸 수 없어요. 다운로드한 HTML 파일을 https 주소로 올려서 Safari/크롬으로 열어 주세요. 지금은 화면을 탭하면 작동합니다.' };
  }
  let noticeT;
  function showNotice(msg) {
    const el = $('notice'); el.textContent = msg; el.hidden = false;
    clearTimeout(noticeT); noticeT = setTimeout(() => { el.hidden = true; }, 9000);
  }
  $('notice').addEventListener('click', e => { e.stopPropagation(); e.currentTarget.hidden = true; });

  function stop() {
    clearInterval(timer); timer = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    hud.hidden = true; overlay.hidden = false;
    meter.style.width = '0%';
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  }

  /* ---------- 움직임 감지 ---------- */
  function sample() {
    let level = 0;
    if (!fallback) {
      if (video.readyState < 2) return;
      mctx.drawImage(video, 0, 0, MW, MH);
      const d = mctx.getImageData(0, 0, MW, MH).data;
      const cur = new Uint8ClampedArray(MW * MH);
      let changed = 0;
      for (let i = 0, p = 0; i < d.length; i += 4, p++) {
        const g = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
        cur[p] = g;
        if (prev && Math.abs(g - prev[p]) > 28) changed++;
      }
      const first = !prev; prev = cur;
      if (first) return;
      level = changed / (MW * MH) * 100;
    } else {
      level = moveDist / Math.hypot(innerWidth, innerHeight) * 60;
      moveDist = 0;
    }
    const th = threshold();
    meter.style.width = Math.min(100, level / th * 100) + '%';
    const now = performance.now();
    if (level >= th && now > armedAt && now > busyUntil) scare();
  }

  // 카메라 대체: 포인터 이동 거리 누적, 화면 탭은 즉시 작동
  addEventListener('pointermove', e => {
    if (!fallback || hud.hidden) return;
    if (lastPt) moveDist += Math.hypot(e.clientX - lastPt.x, e.clientY - lastPt.y);
    lastPt = { x: e.clientX, y: e.clientY };
  });
  addEventListener('pointerdown', e => {
    if (!fallback || hud.hidden || e.target.closest('#hud')) return;
    if (performance.now() > busyUntil) scare();
  });

  /* ---------- 점프스케어 ---------- */
  function scare() {
    busyUntil = performance.now() + SCARE_MS + COOLDOWN_MS;
    stage.classList.remove('active');
    void stage.offsetWidth;  // 애니메이션 재시작
    stage.classList.add('active');
    screamSound();
    if (navigator.vibrate) navigator.vibrate([200, 80, 300]);
    clearTimeout(scare.t);
    scare.t = setTimeout(() => stage.classList.remove('active'), SCARE_MS);
  }

  // 외부 파일 없이 비명 소리 합성
  function screamSound() {
    if (!audio) return;
    const ac = audio, t = ac.currentTime + 0.01, dur = 1.7;
    const out = ac.createDynamicsCompressor(); out.connect(ac.destination);
    const master = ac.createGain(); master.connect(out);
    master.gain.setValueAtTime(0.0001, t);
    master.gain.exponentialRampToValueAtTime(0.9, t + 0.04);
    master.gain.setValueAtTime(0.9, t + 1.05);
    master.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const shaper = ac.createWaveShaper();
    const curve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) curve[i] = Math.tanh((i / 1024 * 2 - 1) * 3.5);
    shaper.curve = curve; shaper.connect(master);

    const lfo = ac.createOscillator(); lfo.frequency.value = 8.5;
    const lfoGain = ac.createGain(); lfoGain.gain.value = 45;
    lfo.connect(lfoGain); lfo.start(t); lfo.stop(t + dur);

    [[640, .32], [960, .22], [1310, .16]].forEach(([f, g]) => {
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f * .6, t);
      o.frequency.exponentialRampToValueAtTime(f * 1.18, t + .16);
      o.frequency.exponentialRampToValueAtTime(f * .82, t + dur);
      lfoGain.connect(o.frequency);
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * 1.6; bp.Q.value = 1.2;
      const gn = ac.createGain(); gn.gain.value = g;
      o.connect(bp); bp.connect(gn); gn.connect(shaper);
      o.start(t); o.stop(t + dur);
    });

    const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    const ns = ac.createBufferSource(); ns.buffer = buf;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
    const ng = ac.createGain(); ng.gain.setValueAtTime(.5, t); ng.gain.exponentialRampToValueAtTime(.02, t + dur);
    ns.connect(hp); hp.connect(ng); ng.connect(master); ns.start(t);

    const boom = ac.createOscillator(); boom.type = 'sine';
    boom.frequency.setValueAtTime(90, t); boom.frequency.exponentialRampToValueAtTime(32, t + .7);
    const bg = ac.createGain(); bg.gain.setValueAtTime(1, t); bg.gain.exponentialRampToValueAtTime(.001, t + .8);
    boom.connect(bg); bg.connect(out); boom.start(t); boom.stop(t + .85);
  }

  /* ---------- HUD 버튼 ---------- */
  $('test-btn').addEventListener('click', e => { e.stopPropagation(); scare(); });
  $('settings-btn').addEventListener('click', e => { e.stopPropagation(); stop(); });

  /* ---------- 화면 꺼짐 방지 ---------- */
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible' && !hud.hidden)
        wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', keepAwake);
})();
</script>

</body>
